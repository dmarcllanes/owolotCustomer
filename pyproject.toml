[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "owolotcustomer"
version = "0.1.0"
description = "Owolot public landing page"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-fasthtml",
    "uvicorn[standard]",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.setuptools]
py-modules = ["main"]
