AWSTemplateFormatVersion: "2010-09-09"
Description: Owolot customer website on AWS Free Tier (EC2 micro + encrypted EBS SQLite + CloudFront HTTPS).

Parameters:
  ImageUri:
    Type: String
    Description: Immutable ECR image URI tagged with the Git commit SHA.
  CloudFrontPrefixListId:
    Type: String
    Description: Regional ID for the AWS-managed CloudFront origin-facing prefix list.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t2.micro
    Description: Free-tier eligible EC2 instance type (750 hours/month for 12 months).
  AdminPasswordParameterName:
    Type: String
    Default: /owolot-customer/beta-admin-password
    Description: SSM Parameter Store SecureString name holding the beta admin password (Always Free standard parameter).
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 x86_64 AMI.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: owolot-customer

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.0.0/20
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: owolot-public-a

  PublicSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetA

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP origin traffic only from CloudFront managed prefix list.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: HTTP from the AWS-managed CloudFront origin-facing ranges.
          IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourcePrefixListId: !Ref CloudFrontPrefixListId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  BetaRequestsVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt PublicSubnetA.AvailabilityZone
      Encrypted: true
      Size: 4
      VolumeType: gp3
      Tags:
        - Key: Name
          Value: owolot-beta-requests

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /owolot-customer/app
      RetentionInDays: 14

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: OwolotContainerRuntimeAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/owolot-customer"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AdminPasswordParameterName}"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AppLogGroup.Arn

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnetA
      SecurityGroupIds:
        - !GetAtt AppSecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 16
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: owolot-customer
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker awscli
          systemctl enable --now docker

          cat <<'EOF' >/usr/local/bin/owolot-deploy
          #!/bin/bash
          set -euo pipefail
          IMAGE_URI="$1"
          REGION="${AWS::Region}"
          PARAM_NAME="${AdminPasswordParameterName}"
          LOG_GROUP="${AppLogGroup}"

          DATA_DEV=""
          for candidate in /dev/sdf /dev/xvdf /dev/nvme1n1; do
            if [ -b "$candidate" ]; then
              DATA_DEV="$candidate"
              break
            fi
          done

          mkdir -p /data
          if [ -n "$DATA_DEV" ]; then
            if ! blkid "$DATA_DEV" >/dev/null 2>&1; then
              mkfs.ext4 -F "$DATA_DEV"
            fi
            if ! mountpoint -q /data; then
              mount "$DATA_DEV" /data
            fi
          fi

          mkdir -p /data/owolot-beta
          chown 10001:10001 /data/owolot-beta
          chmod 0750 /data/owolot-beta

          REGISTRY="$(echo "$IMAGE_URI" | cut -d/ -f1)"
          aws ecr get-login-password --region "$REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"

          BETA_ADMIN_PASSWORD="$(aws ssm get-parameter \
            --region "$REGION" \
            --name "$PARAM_NAME" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)"

          docker pull "$IMAGE_URI"
          docker rm -f owolot-customer >/dev/null 2>&1 || true
          docker run -d \
            --name owolot-customer \
            --restart unless-stopped \
            --user 10001:10001 \
            -p 8000:8000 \
            -v /data/owolot-beta:/data \
            -e PORT=8000 \
            -e DATABASE_PATH=/data/beta_requests.sqlite3 \
            -e BETA_ADMIN_USERNAME=owolot-admin \
            -e BETA_ADMIN_PASSWORD="$BETA_ADMIN_PASSWORD" \
            --log-driver=awslogs \
            --log-opt awslogs-region="$REGION" \
            --log-opt awslogs-group="$LOG_GROUP" \
            --log-opt awslogs-stream=ec2 \
            "$IMAGE_URI"

          docker image prune -af >/dev/null 2>&1 || true
          EOF
          chmod 0750 /usr/local/bin/owolot-deploy

          /usr/local/bin/owolot-deploy "${ImageUri}"

  BetaRequestsVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref AppInstance
      VolumeId: !Ref BetaRequestsVolume

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Owolot customer website and beta request dashboard.
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: OwolotEc2Origin
            DomainName: !GetAtt AppInstance.PublicDnsName
            CustomOriginConfig:
              HTTPPort: 8000
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: OwolotEc2Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - PATCH
            - POST
            - DELETE
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 413f0cc3-94c9-4c54-ae75-58a7f51b2c2d
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  WebsiteUrl:
    Description: HTTPS website URL served by CloudFront.
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
  AdminUrl:
    Description: Private beta request admin URL.
    Value: !Sub "https://${CloudFrontDistribution.DomainName}/admin/beta"
  InstanceId:
    Description: Free-tier EC2 instance running the Owolot container.
    Value: !Ref AppInstance
  DataVolumeId:
    Description: Persistent encrypted EBS volume holding beta requests.
    Value: !Ref BetaRequestsVolume
  AdminPasswordParameter:
    Description: SSM Parameter Store SecureString holding the generated dashboard password.
    Value: !Ref AdminPasswordParameterName
